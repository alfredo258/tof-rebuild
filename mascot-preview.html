<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mascota — The Outbound Force</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#0b0a10; font-family:'DM Sans',system-ui,sans-serif; color:#fff;
      flex-direction:column; gap:30px;
    }
    h1 { font-size:13px; color:#555; letter-spacing:2px; text-transform:uppercase; }
    p { font-size:11px; color:#444; }

    /* ==============================================
       MASCOT: Cute Cat with Glasses on Computer
       STATE 1: Sleeping (default)
       STATE 2: Awake & Working (on hover/click)
       Pure SVG + CSS — Zero JavaScript
    ============================================== */

    .mascot {
      position:relative; width:320px; height:300px; cursor:pointer;
      -webkit-user-select:none; user-select:none;
    }

    /* Checkbox hack for click-to-toggle (not just hover) */
    .mascot-toggle { display:none; }

    .mascot-scene { width:100%; height:100%; }

    /* ---- GENTLE FLOAT ---- */
    .mascot { animation: m-float 5s ease-in-out infinite; }
    @keyframes m-float {
      0%,100% { transform:translateY(0); }
      50% { transform:translateY(-5px); }
    }

    /* ---- SLEEPING STATE ---- */

    /* Breathing */
    .cat-body-main { animation: m-breathe 3.5s ease-in-out infinite; transform-origin:50% 100%; }
    @keyframes m-breathe {
      0%,100% { transform:scaleY(1); }
      50% { transform:scaleY(1.02); }
    }

    /* Head rests down */
    .cat-head-group {
      transition: transform 0.8s cubic-bezier(0.34,1.56,0.64,1);
      transform-origin: 50% 90%;
      transform: rotate(12deg) translateY(6px) translateX(5px);
    }

    /* Eyes closed */
    .eyes-closed { opacity:1; transition: opacity 0.4s ease 0.1s; }
    .eyes-open { opacity:0; transition: opacity 0.3s ease; }

    /* Glasses tilt with head */
    .glasses-group {
      transition: transform 0.8s cubic-bezier(0.34,1.56,0.64,1);
      transform-origin: 50% 50%;
    }

    /* Zzz */
    .zzz { transition: opacity 0.5s ease, transform 0.5s ease; }
    .z1 { animation: m-zzz 3s ease-in-out infinite; }
    .z2 { animation: m-zzz 3s ease-in-out 0.6s infinite; }
    .z3 { animation: m-zzz 3s ease-in-out 1.2s infinite; }
    @keyframes m-zzz {
      0%,100% { opacity:0.2; transform:translate(0,0) scale(1); }
      50% { opacity:0.7; transform:translate(4px,-8px) scale(1.1); }
    }

    /* Tail slow */
    .cat-tail { animation: m-tail-slow 5s ease-in-out infinite; transform-origin:15% 95%; }
    @keyframes m-tail-slow {
      0%,100% { transform:rotate(0); }
      50% { transform:rotate(6deg); }
    }

    /* Ear twitch */
    .ear-right { animation: m-ear 7s ease-in-out infinite; transform-origin:50% 100%; }
    @keyframes m-ear {
      0%,88%,100% { transform:rotate(0); }
      90% { transform:rotate(-10deg); }
      93% { transform:rotate(3deg); }
      95% { transform:rotate(-5deg); }
    }

    /* Front paws relaxed */
    .paw-left, .paw-right {
      transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }

    /* Monitor dim */
    .monitor-light { opacity:0.1; transition: opacity 0.5s ease; }
    .screen-content { opacity:0.15; transition: opacity 0.5s ease; }

    /* Blush hidden */
    .blush { opacity:0; transition: opacity 0.4s ease 0.2s; }

    /* Speech hidden */
    .speech-bubble { opacity:0; transform:scale(0.5); transition: all 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.4s; transform-origin:0% 100%; }

    /* Coffee steam subtle */
    .steam { opacity:0.15; animation: m-steam 3s ease-in-out infinite; }
    @keyframes m-steam {
      0%,100% { opacity:0.1; transform:translateY(0); }
      50% { opacity:0.25; transform:translateY(-3px); }
    }

    /* ---- AWAKE STATE (hover OR checkbox checked) ---- */
    .mascot:hover .cat-head-group,
    .mascot-toggle:checked ~ .mascot-scene .cat-head-group {
      transform: rotate(0deg) translateY(-4px) translateX(0px);
    }

    .mascot:hover .eyes-closed,
    .mascot-toggle:checked ~ .mascot-scene .eyes-closed { opacity:0; }

    .mascot:hover .eyes-open,
    .mascot-toggle:checked ~ .mascot-scene .eyes-open { opacity:1; }

    .mascot:hover .zzz,
    .mascot-toggle:checked ~ .mascot-scene .zzz { opacity:0 !important; transform:translate(15px,-20px) scale(0.5) !important; }

    .mascot:hover .cat-tail,
    .mascot-toggle:checked ~ .mascot-scene .cat-tail { animation: m-tail-fast 0.35s ease-in-out infinite; }
    @keyframes m-tail-fast {
      0%,100% { transform:rotate(-10deg); }
      50% { transform:rotate(10deg); }
    }

    .mascot:hover .cat-body-main,
    .mascot-toggle:checked ~ .mascot-scene .cat-body-main {
      animation:none; transform:scaleY(1.03);
    }

    .mascot:hover .ear-right,
    .mascot-toggle:checked ~ .mascot-scene .ear-right { animation:none; transform:rotate(-3deg); }

    .mascot:hover .paw-left,
    .mascot-toggle:checked ~ .mascot-scene .paw-left { transform:translate(-3px,-2px) rotate(-5deg); }

    .mascot:hover .paw-right,
    .mascot-toggle:checked ~ .mascot-scene .paw-right { transform:translate(3px,-2px) rotate(5deg); }

    .mascot:hover .monitor-light,
    .mascot-toggle:checked ~ .mascot-scene .monitor-light { opacity:0.4; }

    .mascot:hover .screen-content,
    .mascot-toggle:checked ~ .mascot-scene .screen-content { opacity:0.6; }

    .mascot:hover .blush,
    .mascot-toggle:checked ~ .mascot-scene .blush { opacity:0.5; }

    .mascot:hover .speech-bubble,
    .mascot-toggle:checked ~ .mascot-scene .speech-bubble { opacity:1; transform:scale(1); }

    .mascot:hover .steam,
    .mascot-toggle:checked ~ .mascot-scene .steam { opacity:0.4; }

    /* Eye sparkle on awake */
    .eye-sparkle { opacity:0; transition: opacity 0.3s ease 0.3s; }
    .mascot:hover .eye-sparkle,
    .mascot-toggle:checked ~ .mascot-scene .eye-sparkle { opacity:1; }

    /* Pupil look at screen */
    .pupil-group {
      transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.2s;
    }
    .mascot:hover .pupil-group,
    .mascot-toggle:checked ~ .mascot-scene .pupil-group {
      transform: translate(-1px, 1px);
    }

    /* Typing animation on keyboard */
    .typing-paw { opacity:0; transition: opacity 0.3s ease 0.5s; }
    .mascot:hover .typing-paw,
    .mascot-toggle:checked ~ .mascot-scene .typing-paw { opacity:1; animation: m-type 0.3s ease-in-out infinite alternate; }
    @keyframes m-type {
      0% { transform:translateY(0); }
      100% { transform:translateY(-1.5px); }
    }

    @media (prefers-reduced-motion:reduce) {
      .mascot, .cat-body-main, .cat-tail, .ear-right, .z1, .z2, .z3, .steam, .typing-paw { animation:none !important; }
    }
  </style>
</head>
<body>
  <h1>Click o hover sobre el gato</h1>

  <label class="mascot">
    <input type="checkbox" class="mascot-toggle"/>
    <svg viewBox="0 0 320 300" class="mascot-scene" xmlns="http://www.w3.org/2000/svg">

      <!-- ============ DESK ============ -->
      <rect x="20" y="230" width="280" height="70" rx="8" fill="#1a1a2e"/>
      <rect x="25" y="230" width="270" height="4" rx="2" fill="#252545" opacity=".6"/>

      <!-- ============ MONITOR ============ -->
      <g>
        <!-- Monitor body -->
        <rect x="85" y="85" width="150" height="110" rx="8" fill="#252540"/>
        <rect x="80" y="80" width="160" height="115" rx="10" fill="#2d2d50"/>
        <!-- Screen -->
        <rect x="90" y="90" width="140" height="95" rx="6" fill="#0e0e1a"/>
        <!-- Screen glow -->
        <ellipse cx="160" cy="137" rx="55" ry="35" fill="#6d28d9" class="monitor-light"/>
        <!-- Code lines on screen -->
        <g class="screen-content">
          <rect x="100" y="102" width="45" height="3" rx="1.5" fill="#8b5cf6"/>
          <rect x="100" y="110" width="65" height="3" rx="1.5" fill="#6d28d9"/>
          <rect x="100" y="118" width="35" height="3" rx="1.5" fill="#a78bfa"/>
          <rect x="100" y="126" width="55" height="3" rx="1.5" fill="#7c3aed"/>
          <rect x="100" y="134" width="40" height="3" rx="1.5" fill="#8b5cf6"/>
          <rect x="100" y="142" width="70" height="3" rx="1.5" fill="#6d28d9"/>
          <rect x="100" y="150" width="30" height="3" rx="1.5" fill="#a78bfa"/>
          <rect x="100" y="158" width="50" height="3" rx="1.5" fill="#7c3aed"/>
          <rect x="100" y="166" width="60" height="3" rx="1.5" fill="#8b5cf6"/>
          <!-- Cursor blink -->
          <rect x="100" y="174" width="2" height="8" rx="1" fill="#a78bfa" opacity=".6">
            <animate attributeName="opacity" values="0.6;0;0.6" dur="1.2s" repeatCount="indefinite"/>
          </rect>
        </g>
        <!-- Monitor stand -->
        <rect x="145" y="195" width="30" height="18" rx="3" fill="#2d2d50"/>
        <rect x="130" y="210" width="60" height="8" rx="4" fill="#2d2d50"/>
      </g>

      <!-- ============ KEYBOARD ============ -->
      <g>
        <rect x="65" y="222" width="190" height="20" rx="4" fill="#2a2a48"/>
        <rect x="68" y="224" width="184" height="16" rx="3" fill="#1f1f3a"/>
        <!-- Key rows -->
        <g opacity=".35">
          <rect x="73" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="83" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="93" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="103" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="113" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="123" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="133" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="143" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="153" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="163" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="173" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="183" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="193" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="203" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="213" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="223" y="226" width="8" height="4" rx="1" fill="#555"/>
          <rect x="233" y="226" width="12" height="4" rx="1" fill="#555"/>
          <!-- Row 2 -->
          <rect x="75" y="232" width="12" height="4" rx="1" fill="#555"/>
          <rect x="90" y="232" width="8" height="4" rx="1" fill="#555"/>
          <rect x="105" y="232" width="50" height="4" rx="1" fill="#666"/>
          <rect x="160" y="232" width="8" height="4" rx="1" fill="#555"/>
          <rect x="175" y="232" width="8" height="4" rx="1" fill="#555"/>
          <rect x="190" y="232" width="8" height="4" rx="1" fill="#555"/>
          <rect x="205" y="232" width="38" height="4" rx="1" fill="#555"/>
        </g>
      </g>

      <!-- ============ COFFEE MUG ============ -->
      <g>
        <rect x="38" y="212" width="20" height="22" rx="3" fill="#3d2c5e"/>
        <rect x="35" y="210" width="26" height="5" rx="2.5" fill="#4a3570"/>
        <path d="M58 217q7-1 6 6t-6 5" stroke="#3d2c5e" stroke-width="3" fill="none"/>
        <!-- Heart on mug -->
        <path d="M45 220c0-2 2-3 3-1.5c1-1.5 3-.5 3 1.5c0 2.5-3 4-3 4s-3-1.5-3-4" fill="#8b5cf6" opacity=".5"/>
        <!-- Steam -->
        <g class="steam">
          <path d="M44 207q1.5-5 3 0q1.5-4 3 0" stroke="#a78bfa" stroke-width="1" fill="none" opacity=".5"/>
          <path d="M47 205q1-4 2 0q1-3 2 0" stroke="#a78bfa" stroke-width=".8" fill="none" opacity=".3"/>
        </g>
      </g>

      <!-- ============ CAT BODY ============ -->
      <g class="cat-body-main">
        <!-- Tail -->
        <path d="M230 200Q260 185 268 160Q275 135 260 125Q250 118 245 128" stroke="#c4b5fd" stroke-width="10" fill="none" stroke-linecap="round" class="cat-tail"/>
        <circle cx="245" cy="128" r="5" fill="#c4b5fd" class="cat-tail"/>

        <!-- Body -->
        <ellipse cx="175" cy="208" rx="55" ry="28" fill="#c4b5fd"/>
        <!-- Belly -->
        <ellipse cx="172" cy="212" rx="40" ry="20" fill="#e8e0ff" opacity=".3"/>
        <!-- Stripes on body -->
        <path d="M150 195q5-5 10 0" stroke="#b4a0e8" stroke-width="1.5" fill="none" opacity=".3"/>
        <path d="M165 192q5-5 10 0" stroke="#b4a0e8" stroke-width="1.5" fill="none" opacity=".3"/>
        <path d="M180 193q5-5 10 0" stroke="#b4a0e8" stroke-width="1.5" fill="none" opacity=".3"/>

        <!-- Back paw -->
        <ellipse cx="220" cy="225" rx="12" ry="7" fill="#b4a0e8"/>
        <circle cx="216" cy="226" r="2" fill="#9580cc" opacity=".3"/>
        <circle cx="220" cy="227" r="1.5" fill="#9580cc" opacity=".3"/>
        <circle cx="224" cy="226" r="1.5" fill="#9580cc" opacity=".3"/>

        <!-- Front paws on keyboard -->
        <g class="paw-left">
          <ellipse cx="128" cy="222" rx="14" ry="8" fill="#b4a0e8"/>
          <circle cx="122" cy="223" r="2.5" fill="#9580cc" opacity=".3"/>
          <circle cx="127" cy="225" r="2" fill="#9580cc" opacity=".3"/>
          <circle cx="132" cy="223" r="2" fill="#9580cc" opacity=".3"/>
          <!-- Typing motion overlay -->
          <ellipse cx="128" cy="221" rx="13" ry="7" fill="#b4a0e8" class="typing-paw"/>
        </g>
        <g class="paw-right">
          <ellipse cx="178" cy="222" rx="14" ry="8" fill="#b4a0e8"/>
          <circle cx="172" cy="223" r="2.5" fill="#9580cc" opacity=".3"/>
          <circle cx="177" cy="225" r="2" fill="#9580cc" opacity=".3"/>
          <circle cx="182" cy="223" r="2" fill="#9580cc" opacity=".3"/>
          <ellipse cx="178" cy="221" rx="13" ry="7" fill="#b4a0e8" class="typing-paw" style="animation-delay:.15s"/>
        </g>
      </g>

      <!-- ============ CAT HEAD ============ -->
      <g class="cat-head-group">
        <!-- Head -->
        <ellipse cx="150" cy="170" rx="38" ry="34" fill="#c4b5fd"/>

        <!-- Ears -->
        <path d="M117 148L108 115L130 140Z" fill="#c4b5fd"/>
        <path d="M119 145L112 120L128 140Z" fill="#e8b4c8" opacity=".35"/>
        <g class="ear-right">
          <path d="M183 148L192 115L170 140Z" fill="#c4b5fd"/>
          <path d="M181 145L188 120L172 140Z" fill="#e8b4c8" opacity=".35"/>
        </g>

        <!-- Head stripes -->
        <path d="M135 148q3-4 6 0" stroke="#b4a0e8" stroke-width="1.2" fill="none" opacity=".25"/>
        <path d="M145 145q3-4 6 0" stroke="#b4a0e8" stroke-width="1.2" fill="none" opacity=".25"/>
        <path d="M155 147q3-4 6 0" stroke="#b4a0e8" stroke-width="1.2" fill="none" opacity=".25"/>

        <!-- Face lighter area -->
        <ellipse cx="150" cy="174" rx="30" ry="26" fill="#d4c8f0" opacity=".25"/>

        <!-- ---- CLOSED EYES (sleeping) ---- -->
        <g class="eyes-closed">
          <path d="M132 168q6 4 12 0" stroke="#3d2014" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M157 168q6 4 12 0" stroke="#3d2014" stroke-width="2" fill="none" stroke-linecap="round"/>
          <!-- Eyelashes sleeping -->
          <line x1="131" y1="168" x2="129" y2="165" stroke="#3d2014" stroke-width="1" stroke-linecap="round"/>
          <line x1="156" y1="168" x2="154" y2="165" stroke="#3d2014" stroke-width="1" stroke-linecap="round"/>
        </g>

        <!-- ---- OPEN EYES (awake) ---- -->
        <g class="eyes-open">
          <g class="pupil-group">
            <!-- Left eye -->
            <ellipse cx="138" cy="166" rx="8" ry="9" fill="#fff"/>
            <circle cx="138" cy="167" r="5.5" fill="#4a2810"/>
            <circle cx="138" cy="167" r="3.5" fill="#111"/>
            <circle cx="140" cy="164.5" r="2" fill="#fff" class="eye-sparkle"/>
            <circle cx="136" cy="168" r="1" fill="#fff" opacity=".4" class="eye-sparkle"/>
            <!-- Right eye -->
            <ellipse cx="163" cy="166" rx="8" ry="9" fill="#fff"/>
            <circle cx="163" cy="167" r="5.5" fill="#4a2810"/>
            <circle cx="163" cy="167" r="3.5" fill="#111"/>
            <circle cx="165" cy="164.5" r="2" fill="#fff" class="eye-sparkle"/>
            <circle cx="161" cy="168" r="1" fill="#fff" opacity=".4" class="eye-sparkle"/>
          </g>
          <!-- Eyelashes awake -->
          <path d="M128 162q2-3 4-1" stroke="#3d2014" stroke-width="1" fill="none"/>
          <path d="M130 160q2-2 3 0" stroke="#3d2014" stroke-width=".8" fill="none"/>
          <path d="M168 160q2-2 3 0" stroke="#3d2014" stroke-width=".8" fill="none"/>
          <path d="M170 162q2-3 4-1" stroke="#3d2014" stroke-width="1" fill="none"/>
          <!-- Eyebrows -->
          <path d="M130 158q4-3 8 0" stroke="#9580cc" stroke-width="1.2" fill="none" opacity=".4"/>
          <path d="M155 158q4-3 8 0" stroke="#9580cc" stroke-width="1.2" fill="none" opacity=".4"/>
        </g>

        <!-- ---- GLASSES ---- -->
        <g class="glasses-group">
          <!-- Left lens -->
          <circle cx="138" cy="167" r="12" fill="none" stroke="#555" stroke-width="2"/>
          <circle cx="138" cy="167" r="12" fill="#88f" opacity=".03"/>
          <!-- Right lens -->
          <circle cx="163" cy="167" r="12" fill="none" stroke="#555" stroke-width="2"/>
          <circle cx="163" cy="167" r="12" fill="#88f" opacity=".03"/>
          <!-- Bridge -->
          <path d="M150 167q0-3 1 0" stroke="#555" stroke-width="2" fill="none"/>
          <!-- Temple arms -->
          <line x1="126" y1="165" x2="115" y2="160" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="175" y1="165" x2="186" y2="160" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
          <!-- Lens glare -->
          <path d="M131 162q2-3 5-1" stroke="#fff" stroke-width=".8" fill="none" opacity=".15"/>
          <path d="M156 162q2-3 5-1" stroke="#fff" stroke-width=".8" fill="none" opacity=".15"/>
        </g>

        <!-- Nose -->
        <path d="M148 177l2.5 3l2.5-3" fill="#e8a0b0"/>
        <ellipse cx="150.5" cy="177.5" rx="2.5" ry="2" fill="#e8a0b0"/>

        <!-- Mouth -->
        <path d="M147 181q3.5 2 7 0" stroke="#c4956a" stroke-width=".8" fill="none" opacity=".5"/>
        <!-- Little tooth (awake) -->

        <!-- Whiskers -->
        <g opacity=".2" stroke="#8b7db5" stroke-width=".8">
          <line x1="130" y1="175" x2="105" y2="172"/>
          <line x1="130" y1="178" x2="102" y2="179"/>
          <line x1="130" y1="181" x2="105" y2="185"/>
          <line x1="171" y1="175" x2="196" y2="172"/>
          <line x1="171" y1="178" x2="199" y2="179"/>
          <line x1="171" y1="181" x2="196" y2="185"/>
        </g>

        <!-- Blush -->
        <ellipse cx="126" cy="176" rx="6" ry="3.5" fill="#f5a0b8" class="blush"/>
        <ellipse cx="175" cy="176" rx="6" ry="3.5" fill="#f5a0b8" class="blush"/>
      </g>

      <!-- ============ ZZZ ============ -->
      <text x="195" y="140" font-family="system-ui" font-size="14" font-weight="800" fill="#8b5cf6" class="zzz z1">z</text>
      <text x="210" y="125" font-family="system-ui" font-size="18" font-weight="800" fill="#8b5cf6" class="zzz z2">z</text>
      <text x="228" y="108" font-family="system-ui" font-size="22" font-weight="800" fill="#8b5cf6" class="zzz z3">Z</text>

      <!-- ============ SPEECH BUBBLE ============ -->
      <g class="speech-bubble">
        <rect x="200" y="120" width="95" height="36" rx="10" fill="#fff"/>
        <polygon points="200,140 210,148 215,138" fill="#fff"/>
        <text x="213" y="135" font-family="system-ui" font-size="9" fill="#6d28d9" font-weight="700">A trabajar!</text>
        <text x="213" y="147" font-family="system-ui" font-size="8" fill="#999">&#128008; &#128187;</text>
      </g>

      <!-- ============ SMALL PLANT (detail) ============ -->
      <g>
        <rect x="260" y="215" width="14" height="16" rx="3" fill="#2d2050"/>
        <path d="M264 215q3-8 7 0" stroke="#4ade80" stroke-width="1.5" fill="none"/>
        <path d="M266 215q1-10 5-5" stroke="#22c55e" stroke-width="1.2" fill="none"/>
        <circle cx="270" cy="207" r="2" fill="#4ade80" opacity=".5"/>
      </g>

    </svg>
  </label>

  <p>CSS puro — Zero JS — Click para alternar estado</p>
</body>
</html>
